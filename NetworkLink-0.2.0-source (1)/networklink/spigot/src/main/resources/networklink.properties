# NetworkLink node configuration for Spigot/Paper
node.id=backend-1
node.name=Backend 1

dashboard.enabled=true
dashboard.host=0.0.0.0
dashboard.port=8090
dashboard.token=CHANGE-ME-BACKEND-TOKEN

# Remote nodes can be BungeeCord, Velocity or another Spigot/Paper server.
# links.proxy-1.url=http://10.0.0.1:8088
# links.proxy-1.token=CHANGE-ME-PROXY-TOKEN

poll.seconds=5

# Maintenance
maintenance.enabled=false
maintenance.reason=Server in manutenzione. Riprova piu tardi.
maintenance.bypass-permission=networklink.maintenance.bypass

# For proxy maintenance blocking, set the backend node.id equal to the proxy server name, e.g. LOBBY.
