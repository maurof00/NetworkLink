<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NetworkLink Dashboard</title>
<style>
body{font-family:Inter,system-ui,Arial,sans-serif;margin:0;background:#0b1020;color:#e7ecff}main{max-width:1220px;margin:0 auto;padding:28px}h1{margin:0 0 8px}h2{margin:0 0 12px}p{color:#9ca9cb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}.card{background:#121a31;border:1px solid #24304f;border-radius:14px;padding:18px;box-shadow:0 8px 30px #0003}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.pill{border-radius:999px;padding:4px 9px;font-size:12px;white-space:nowrap}.ok{background:#173b2a;color:#7ee2a8}.off{background:#4a2023;color:#ff9ea6}.maint{background:#4b3515;color:#ffd27a}.muted{color:#91a0c3}.servers{margin-top:14px;border-top:1px solid #24304f;padding-top:10px}.server{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #1b2540}.server:last-child{border-bottom:0}.form{display:grid;grid-template-columns:1fr 1.4fr 1.4fr auto;gap:8px;margin-top:12px}.form input,.reason{background:#0b1020;color:#fff;border:1px solid #2a3558;border-radius:9px;padding:10px}.form button,.actions button,button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer}.primary{background:#dbe7ff;color:#0b1020}.danger{background:#4a2023;color:#fff}.maintenance{background:#664718;color:#fff}.linkline{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #24304f;align-items:center}.footer{margin-top:20px;font-size:12px;color:#7080a7}.maintbox{margin-top:12px;padding:10px;border-radius:10px;background:#0f1528;border:1px solid #263352}.maintbox .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.small{font-size:13px}@media(max-width:750px){.form{grid-template-columns:1fr}.form button{width:100%}}
</style></head>
<body><main>
<div class="row"><div><h1>NetworkLink</h1><p>Stato dei nodi, server/backend collegati e modalità manutenzione.</p></div><div><button onclick="setToken()">Token</button></div></div>
<div id="content" class="grid"></div>
<div class="card" style="margin-top:14px"><h2>Aggiungi collegamento nodo</h2>
<div class="form"><input id="id" placeholder="ID, es. LOBBY"><input id="url" placeholder="http://10.0.0.20:8090"><input id="token" placeholder="Token del nodo remoto" type="password"><button class="primary" onclick="addLink()">Collega</button></div>
<div id="links" style="margin-top:12px"></div></div>
<div class="footer">NetworkLink 0.2.0 · il token dashboard viene salvato solo nel localStorage del browser.</div>
</main>
<script>
const key='networklink-token';
function token(){return localStorage.getItem(key)||''}
function setToken(){const t=prompt('Token dashboard:');if(t){localStorage.setItem(key,t);load()}}
async function api(path,opt={}){opt.headers=Object.assign({'X-NetworkLink-Token':token()},opt.headers||{});const r=await fetch(path,opt);if(!r.ok)throw new Error(await r.text());return r.json()}
function maintenanceBadge(s){return s.maintenance?'<span class="pill maint">MANUTENZIONE</span>':''}
function maintenanceBox(id,enabled,reason,remote){const action=enabled?'Disattiva manutenzione':'Attiva manutenzione';const btnClass=enabled?'danger':'maintenance';const safeId=encodeURIComponent(id);return `<div class="maintbox"><div class="row"><b>Manutenzione</b>${enabled?'<span class="pill maint">ATTIVA</span>':'<span class="pill ok">DISATTIVA</span>'}</div>${enabled&&reason?`<p class="small" style="margin:8px 0 0">${esc(reason)}</p>`:''}<input class="reason" id="reason-${safeId}-${remote?'r':'l'}" style="width:calc(100% - 22px);margin-top:9px" placeholder="Motivo (opzionale)"><div class="actions"><button class="${btnClass}" onclick="toggleMaintenance('${safeId}',${remote},${enabled})">${action}</button></div></div>`}
function card(s,remote=false,linkId=null){const cls=s.online?'ok':'off',txt=s.online?'ONLINE':'OFFLINE';const target=linkId||s.id;return `<div class="card"><div class="row"><div><b>${esc(s.name)}</b><div class="muted small">${esc(s.id)} · ${esc(s.platform)} · giocatori ${s.players}</div></div><div>${maintenanceBadge(s)} <span class="pill ${cls}">${txt}</span></div></div>${s.maintenance?`<div class="maintbox"><b>Server in manutenzione</b><p class="small">${esc(s.maintenanceReason||'Server in manutenzione.')}</p></div>`:''}<div class="servers">${s.servers.length?s.servers.map(v=>`<div class="server"><span><b>${esc(v.name)}</b><div class="muted small">${esc(v.address)}</div></span><span>${v.maintenance?'<span class="pill maint">MAINT</span> ':''}${v.online?'🟢':'🔴'} ${v.players}</span></div>`).join(''):'<div class="muted small">Nessun backend registrato.</div>'}</div>${maintenanceBox(target,s.maintenance,s.maintenanceReason,remote)}</div>`}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function load(){if(!token()){document.getElementById('content').innerHTML='<div class="card"><b>Inserisci il token dashboard.</b><p>Premi “Token” in alto a destra.</p></div>';return}try{const d=await api('/api/v1/dashboard');let html='';if(d.local)html+=card(d.local,false,d.local.id);for(const l of d.links){if(l.snapshot)html+=card(l.snapshot,true,l.id);else html+=`<div class="card"><div class="row"><b>${esc(l.id)}</b><span class="pill off">OFFLINE</span></div><p>${esc(l.url)}</p></div>`}document.getElementById('content').innerHTML=html||'<div class="card">Nessun nodo disponibile.</div>';document.getElementById('links').innerHTML=d.links.map(l=>`<div class="linkline"><span><b>${esc(l.id)}</b> <span class="muted">${esc(l.url)}</span></span><button class="danger" onclick="removeLink('${encodeURIComponent(l.id)}')">Rimuovi</button></div>`).join('')}catch(e){document.getElementById('content').innerHTML='<div class="card"><b>Errore autenticazione o dashboard non raggiungibile.</b><p>'+esc(e.message)+'</p></div>'}}
async function toggleMaintenance(id,remote,enabled){const decoded=decodeURIComponent(id);const suffix=remote?'r':'l';const reasonEl=document.getElementById('reason-'+id+'-'+suffix);const reason=reasonEl?reasonEl.value:'';try{const data=new URLSearchParams({enabled:String(!enabled),reason});if(remote)data.set('id',decoded);await api(remote?'/api/v1/remote-maintenance':'/api/v1/maintenance',{method:'POST',body:data});await load()}catch(e){alert(e.message)}}
async function addLink(){try{const data=new URLSearchParams({id:document.getElementById('id').value,url:document.getElementById('url').value,token:document.getElementById('token').value});await api('/api/v1/links',{method:'POST',body:data});document.getElementById('id').value='';document.getElementById('url').value='';document.getElementById('token').value='';load()}catch(e){alert(e.message)}}
async function removeLink(id){try{await api('/api/v1/links?id='+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}
load();setInterval(load,3000);
</script></body></html>
